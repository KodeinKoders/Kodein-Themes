extends:
  - default-for-print
  - ./brand-base-theme.yml

font:
  catalog:
    merge: true
    LCTPicon:
      normal: LCTPicon-Regular-Normal.ttf
      italic: LCTPicon-Regular-Light.ttf
      bold: LCTPicon-Regular-Black.ttf
      bold_italic: LCTPicon-Regular-Bold.ttf
    JetBrainsMono:
      normal: JetBrainsMono-Regular-withCallouts.ttf
      italic: JetBrainsMono-Italic.ttf
      bold: JetBrainsMono-Bold.ttf
      bold_italic: JetBrainsMono-BoldItalic.ttf

base:
  font-family: LCTPicon
  font-color: $brand-purple-800

heading:
  font-color: $brand-orange-600
  h5-font-size: $base-font-size-large
  h5-font-style: normal
  h6-font-size: $base-font-size
  h6-font-style: normal

code:
  font-family: JetBrainsMono
  font-size: 10
  background-color: $brand-purple-050
  border-color: $brand-purple-600
  border-radius: 12

codespan:
  background-color: $brand-purple-050
  font-color: $brand-purple-500
  font-family: JetBrainsMono

title-page:
  title:
    font-color: $brand-orange-600
    font-style: bold
    font-size: floor($base-font-size * 3.8)

footer:
  pages: +title,+toc
  height: 16mm
  padding: [2mm, 0mm, 6mm, 0mm]
  recto:
    right:
      content: '{page-number}'
    left:
      content: "image:{pdf-themes-imagesdir}/logo-light.svg[]"
  verso:
    left:
      content: '{page-number}'
    right:
      content: "image:{pdf-themes-imagesdir}/logo-light.svg[]"

running-content:
  start-at: title

conum:
  font-family: JetBrainsMono
  font-size: 10
  line-height: 2.1

caption:
  font-size: 10
  font-color: $brand-purple-500
  font-family: JetBrainsMono
  font-style: bold

admonition:
  column-rule-color: $brand-orange-400
  font-color: $brand-orange-800
  label:
    font-color: $brand-orange-400

quote:
  border-color: $brand-orange-400
  cite:
    font-color: $brand-orange-400

verse:
  border-color: $brand-orange-400
  cite:
    font-color: $brand-orange-400

example:
  border-color: $brand-purple-600
  border-radius: 12
  font-color: $brand-purple-600

sidebar:
  background-color: $brand-orange-100
  border-color: $brand-orange-800
  border-radius: 12
  font-color: $brand-orange-900
  title:
    font-color: $brand-orange-800

table:
  border-color: $brand-purple-600
  border-width: 0.75
  body:
    stripe_background_color: $brand-orange-100
  foot:
    background-color: $brand-orange-050
